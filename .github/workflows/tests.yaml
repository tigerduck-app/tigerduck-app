name: Tests

# Unit tests only: simulator UI automation flakes, so TigerDuckUITests stays out. The phone and
# watch suites run as parallel jobs, next to a build of the macOS app, whose tests are not run.


on:
  pull_request:
    branches: [main, dev]
  # A push to dev or main only builds, to save the build caches pull requests start from; the
  # pull request already ran the tests. A documentation-only push builds nothing.
  push:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # The Xcode and simulators the maintainers test on before pushing: Xcode 27.1, an iPhone 18 Pro
    # on iOS 27.0 and an Apple Watch Series 12 (46mm) on watchOS 27.0. The xcode-27 image is still
    # a preview (https://github.com/actions/runner-images/issues/14404).
    name: unit-tests (${{ matrix.leg }})
    runs-on: xcode-27
    timeout-minutes: 60
    # `actions: write` lets a push run delete the cache it started from once
    # it has saved a newer one. A fork's pull request gets a read-only
    # token whatever this says, and pull requests never delete anyway.
    permissions:
      contents: read
      actions: write
    strategy:
      # Let both legs report: a phone failure must not cancel the watch run
      # and hide whatever it would have found.
      fail-fast: false
      matrix:
        include:
          - leg: phone
            scheme: TigerDuck
            runtime: iOS
            device: iPhone 18 Pro
            only_testing: TigerDuckTests
            # The tests that make a window key or bring up the keyboard, a view service, accessibility
            # or WebKit, which run in a step of their own. A Swift Testing function's identifier
            # carries its argument labels.
            on_screen_tests: >-
              TigerDuckTests/MailHTMLSanitizerTests/aFixedImageBoxKeepsItsRatioOnThePage(pageWidth:)
              TigerDuckTests/MailMuteSettingsScreenTests
              TigerDuckTests/MailMessageViewModelTests/aLightModeSwitchReusesTheInstalledRules()
              TigerDuckTests/MailMessageViewModelTests/inlineImagesThatArriveLaterReachThePage()
              TigerDuckTests/MailMessageViewModelTests/theWebViewIsLockedDown()
              TigerDuckTests/MailReadableHTMLTests/theLinkColourIsWebKitsOwn(theme:)
              TigerDuckTests/ArchiveScreensTests
              TigerDuckTests/BrowserAddressSheetTests
              TigerDuckTests/BrowserAtRiskTests
              TigerDuckTests/BrowserPinnedHostsTests
              TigerDuckTests/BrowserContentRulesTests
              TigerDuckTests/BrowserDemoPageLoadTests
              TigerDuckTests/BrowserFindPageTests
              TigerDuckTests/BrowserPageScriptsTests
              TigerDuckTests/BrowserPageUITests
              TigerDuckTests/BrowserSiteSignInPageTests
              TigerDuckTests/ClassTableCalendarMenuTests
              TigerDuckTests/ClassTableShareSheetTests
              TigerDuckTests/ClassTableSwitcherTests
              TigerDuckTests/ClassTableWeekHeaderTests
              TigerDuckTests/ClubScreensTests
              TigerDuckTests/CourseColorPickerSheetTests
              TigerDuckTests/CourseDetailRootBarTests
              TigerDuckTests/CourseSyllabusPageTests
              TigerDuckTests/EmptyClassroomLayoutTests
              TigerDuckTests/ForwardPagingLockTests
              TigerDuckTests/HomeEditPageTests
              TigerDuckTests/HomeScrollAnchorTests
              TigerDuckTests/InformationSystemPageTests
              TigerDuckTests/LibraryWaitLayoutTests
              TigerDuckTests/ModalClosingTests
              TigerDuckTests/MoodleAssignmentPageStateTests
              TigerDuckTests/MoodleAssignmentPageTests/fetchesOnReturn()
              TigerDuckTests/MoodleAssignmentPageTests/switchedPageFetches()
              TigerDuckTests/MoodleCourseStoreTests/sectionFetchesGrades()
              TigerDuckTests/MoodleCourseMembersTests/aKeyThatMatchesNobodyKeepsTheSearchField()
              TigerDuckTests/MoodleCourseMembersTests/aMembersOwnPictureOpensFromTheirPage()
              TigerDuckTests/MoodleCourseMembersTests/aRowTellsTheDepartmentAfterTheStudentId()
              TigerDuckTests/MoodleCourseMembersTests/onlyRowsOnScreenAskForTheirPictures()
              TigerDuckTests/MoodleCourseSearchPageTests
              TigerDuckTests/MoodleMaterialsWeekPageTests
              TigerDuckTests/MoodleMemberCommonCoursesScreenTests
              TigerDuckTests/MoodleNotificationSettingsScreenTests
              TigerDuckTests/MoodleOwnProfileTests/doneUploadsOnce()
              TigerDuckTests/MoodleOwnProfileTests/theCameraButtonFollowsTheSite()
              TigerDuckTests/MoodleOwnProfileTests/theOwnRowSaysMe()
              TigerDuckTests/MoodleRefreshFailureNoteTests/noteShowsOnlyOverContent()
              TigerDuckTests/MoreHomeLayoutTests
              TigerDuckTests/NavigationBarSearchTests
              TigerDuckTests/PageMenuScreenTests
              TigerDuckTests/PasswordFieldAutoFillTests
              TigerDuckTests/PullToRevealSearchTests
              TigerDuckTests/ScrollPositionOriginTests
              TigerDuckTests/SearchDrawerFirstOpenTests
              TigerDuckTests/SettingsScreenTests
              TigerDuckTests/SettingsSnapshotTests
              TigerDuckTests/StorageSettingsScreenTests
              TigerDuckTests/SyncStatusDotDetailsTests
              TigerDuckTests/TigerSyncLinksSectionTests
              TigerDuckTests/TimeSliderAccessibilityTests
              TigerDuckTests/TLSPinPromptTests
              TigerDuckTests/WhatsNewPagerTests
          # The watch app is a companion app with its own scheme and destination; Xcode pairs the
          # watch simulator with a phone one. The scheme builds the phone app for running only:
          # built for testing on a watch destination it compiled twice the phone leg's code.
          - leg: watch
            scheme: TigerDuckWatch Watch App
            runtime: watchOS
            device: Apple Watch Series 12 (46mm)
            only_testing: ""
            on_screen_tests: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every Apple target's "Generate Localizations" phase runs app-translation's generator.
          # Without the submodule the build fails there rather than on anything this workflow is
          # meant to catch.
          submodules: true
          # Two commits, the merge and its first parent, for the path check below.
          fetch-depth: 2

      # A documentation-only change skips the steps below rather than the job: a skipped matrix
      # job never reports `unit-tests (phone)` to a required check. `test` is false on a push,
      # which only builds. A push compares against the commit it replaced, so a code commit
      # followed by a documentation commit still builds. The diff lists both sides of a rename,
      # and non-ASCII paths unquoted, as every path check in this file does.
      - name: Changed paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          base=HEAD^1
          if [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ] && git fetch -q --depth=1 origin "$BEFORE"; then
            base=$BEFORE
          fi
          files=$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD)
          if [ -n "$files" ] && ! printf '%s\n' "$files" \
              | grep -qvE '\.md$|^(docs|openspec|api-poc|\.claude|\.agents|\.greptile|\.github/ISSUE_TEMPLATE)/|^LICENSE'; then
            run=false
            echo "Documentation-only change: skipping the build and tests."
          fi
          test=$run
          if [ "$EVENT" != pull_request ]; then test=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "test=$test" >> "$GITHUB_OUTPUT"

      # The core count is what the test timings below have to be read
      # against: Swift Testing runs tests side by side, so a suite a dev Mac
      # finishes in seconds can take minutes on a runner a quarter its size.
      - name: Xcode version
        if: steps.changes.outputs.run == 'true'
        run: |
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string hw.ncpu

      # The newest runtime that has the named device wins: `OS=latest` can resolve to a runtime the
      # device does not exist on, and the image's iOS 27.1 runtime has only iPhone Duo.
      - name: Pick a simulator
        if: steps.changes.outputs.run == 'true'
        id: sim
        env:
          RUNTIME: ${{ matrix.runtime }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | jq -r --arg os "$RUNTIME" --arg name "$DEVICE" '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime\\." + $os + "-"))
              | (.key | capture("-(?<a>[0-9]+)-(?<b>[0-9]+)$")) as $v
              | .value[]
              | select(.name == $name)
              | {ver: [($v.a | tonumber), ($v.b | tonumber)], udid}
            ] | sort_by(.ver) | last.udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::no $RUNTIME simulator named $DEVICE"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep -E "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Restores this leg's last build so only changed files recompile. A fresh checkout gives
      # every file a new mtime, so the action also puts back the old mtime of each unchanged
      # file. A stale cache (a package bump, a new Xcode) means a 12 to 15 minute build.
      - name: Restore the last build
        if: steps.changes.outputs.run == 'true'
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f  # v1.9.2
        with:
          key: xcode27-${{ matrix.leg }}-${{ github.sha }}
          restore-keys: xcode27-${{ matrix.leg }}-
          # Outside the checkout, so the action's mtime scan does not walk into them.
          deriveddata-directory: ${{ runner.temp }}/DerivedData
          sourcepackages-directory: ${{ runner.temp }}/SourcePackages
          # Per leg: DerivedData remembers the mtimes of the package clone it compiled, so a clone
          # shared by both legs made the other leg rebuild every package.
          swiftpm-cache-key: xcode-packages-${{ matrix.leg }}-${{ hashFiles('swift/TigerDuck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          # The action skips Icon Composer bundles unless listed, and actool then re-renders the icon.
          restore-mtime-targets: |
            swift/**/*.icon
            swift/**/*.icon/**/*
          # Only pushes save, and a push that saved a newer build deletes the one it restored, so
          # each leg keeps one cache per branch; per-PR caches would crowd the 10 GB limit.
          cache-read-only: ${{ github.event_name != 'push' }}
          delete-used-deriveddata-cache: ${{ github.event_name == 'push' }}

      # The next steps split `xcodebuild test` into resolve, build, boot and run, so the job view
      # times each part.
      - name: Resolve packages
        if: steps.changes.outputs.run == 'true'
        env:
          SCHEME: ${{ matrix.scheme }}
        run: >
          xcodebuild -resolvePackageDependencies
          -project swift/TigerDuck.xcodeproj
          -scheme "$SCHEME"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      # No index store: nothing here reads it, and writing it costs compile time and cache space.
      # The log goes to a file with arrival times; the step prints where the time went, compiles
      # per target (a warm build compiles little) and xcodebuild's timing summary.
      - name: Build for testing
        if: steps.changes.outputs.run == 'true'
        env:
          SCHEME: ${{ matrix.scheme }}
          UDID: ${{ steps.sim.outputs.udid }}
          ONLY_TESTING: ${{ matrix.only_testing }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/build.log"
          now() { perl -MTime::HiRes=time -e 'printf "%.1f", time'; }
          start=$(now)
          # Signing stays on: CODE_SIGNING_ALLOWED=NO drops the entitlements and with them the App
          # Group container, and the DEBUG guard in `WidgetSnapshotStore` then crashes the test host.
          if ! xcodebuild build-for-testing \
              -project swift/TigerDuck.xcodeproj \
              -scheme "$SCHEME" \
              -destination "id=$UDID" \
              ${ONLY_TESTING:+"-only-testing:$ONLY_TESTING"} \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
              -showBuildTimingSummary \
              COMPILER_INDEX_STORE_ENABLE=NO \
              2>&1 | perl -MTime::HiRes=time -ne 'printf "%.1f %s", time, $_' > "$log"; then
            cut -d' ' -f2- "$log" | grep -E "error:" | sort -u | head -50
            tail -n 30 "$log" | cut -d' ' -f2-
            exit 1
          fi
          end=$(now)
          set +o pipefail
          # A stretch of silence is charged to the next task line: the blank
          # and command lines around a task print with it, not before it.
          echo "-- where the $(perl -e "printf '%.0f', $end - $start") s went, by the task line that ended each stretch"
          awk -v start="$start" -v end="$end" '
              { line = substr($0, index($0, " ") + 1); gap = (NR == 1 ? $1 - start : $1 - prev); prev = $1 }
              NR == 1 { sum["(xcodebuild starting up)"] += gap; next }
              match(line, /^[A-Z][A-Za-z]+ /) { sum[substr(line, 1, RLENGTH - 1)] += pending + gap; pending = 0; next }
              { pending += gap }
              END {
                sum["(after the last task)"] += pending + end - prev
                for (k in sum) printf "%7.1f  %s\n", sum[k], k
              }' "$log" | sort -rn 2>/dev/null | head -8
          echo "-- compiles by target"
          cut -d' ' -f2- "$log" | grep -E '^(SwiftCompile|CompileC) ' \
            | grep -oE "in target '[^']+' from project '[^']+'" | sort | uniq -c | sort -rn | head -15
          echo "-- xcodebuild timing summary"
          cut -d' ' -f2- "$log" | sed -n '/Build Timing Summary/,$p' | grep -v '^$' | head -10
          true

      # Boot after the build, not during it: on the 3-core runner a first boot cut the cache
      # download from about 70 MB/s to 4, and during the build it cost xcodebuild 68 to 171 s of
      # start-up and 33 to 96 s of package graph. bootstatus prints a line a second.
      - name: Boot the simulator
        if: steps.changes.outputs.test == 'true'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$UDID" -b | tail -n 3

      # Run from the .xctestrun the build wrote, so xcodebuild does not load the project and
      # resolve packages again. Newest first: the restored DerivedData can hold an older one.
      # Not quiet, so the log shows each test start and end. A run still going after 30 minutes,
      # several times a normal run, is taken for hung rather than left to the job's limit: the step
      # lists the tests that started and did not end, samples the test host, keeps both with the
      # simulator's log in hang/ and fails.
      - name: Unit tests (${{ matrix.leg }})
        if: steps.changes.outputs.test == 'true'
        id: tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          ONLY_TESTING: ${{ matrix.only_testing }}
          ON_SCREEN_TESTS: ${{ matrix.on_screen_tests }}
        run: |
          xctestrun=$(ls -t "$RUNNER_TEMP"/DerivedData/Build/Products/*.xctestrun | head -n 1)
          echo "$xctestrun"
          skip=()
          for id in $ON_SCREEN_TESTS; do skip+=("-skip-testing:$id"); done
          log="$RUNNER_TEMP/tests.log"
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "id=$UDID" \
            ${ONLY_TESTING:+"-only-testing:$ONLY_TESTING"} \
            "${skip[@]}" \
            -resultBundlePath Tests.xcresult \
            > "$log" 2>&1 &
          tests=$!
          tail -n +1 -f "$log" &
          echo_log=$!
          set +e
          limit=$((SECONDS + 30 * 60))
          while kill -0 "$tests" 2>/dev/null && [ "$SECONDS" -lt "$limit" ]; do sleep 5; done
          if ! kill -0 "$tests" 2>/dev/null; then
            wait "$tests"
            status=$?
            sleep 2
            kill "$echo_log"; wait "$echo_log" 2>/dev/null
            exit "$status"
          fi
          sleep 2
          kill "$echo_log"; wait "$echo_log" 2>/dev/null
          echo "::error::The tests were still running after 30 minutes; the xcresults artifact keeps hang/"
          mkdir -p hang
          cp "$log" hang/
          echo "-- started and not ended"
          perl -ne '
              if (/\xE2\x97\x87 Test (?!run |case )(.+) started\.$/) { $open{$1} = 1 }
              elsif (/(?:\xE2\x9C\x94|\xE2\x9C\x98) Test (.+?)(?: with \d+ test cases?)? (?:passed|failed) after /) { delete $open{$1} }
              elsif (/Test Case \x27(.+)\x27 started\./) { $open{$1} = 1 }
              elsif (/Test Case \x27(.+)\x27 (?:passed|failed) \(/) { delete $open{$1} }
              END { print "$_\n" for sort keys %open }' "$log" | tee hang/running.txt
          # A wedged diagnostic must not hold the step to the job's limit; macOS has no `timeout`.
          bounded() { perl -e 'alarm shift; exec @ARGV or exit 127' "$@"; }
          for pid in $(pgrep -f "CoreSimulator/Devices/$UDID/data/Containers/Bundle/Application/"); do
            bounded 40 sample "$pid" 10 -file "hang/sample-$pid.txt" > /dev/null 2>&1
            echo "-- call graph of $(ps -o comm= -p "$pid")"
            sed -n '/^Call graph:/,/^$/p' "hang/sample-$pid.txt" | head -n 80
          done
          bounded 120 xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process BEGINSWITH "TigerDuck"' > hang/simulator.log 2>&1
          find Tests.xcresult -name 'Session-*.log' -exec cp {} hang/ \; 2>/dev/null
          # INT, not TERM: xcodebuild catches INT even as a background job and closes the result
          # bundle in about 30 s, while TERM ends it at once with the bundle left open.
          kill -INT "$tests"
          for _ in $(seq 18); do kill -0 "$tests" 2>/dev/null || break; sleep 5; done
          kill -KILL "$tests" 2>/dev/null
          exit 1

      # On a simulator that has just booted, a window becoming key, the keyboard coming up or WebKit
      # starting can hold the main thread for a minute, and every test waiting on the main actor
      # meanwhile times out (#333, #530). After the rest the simulator has settled, and run one at a
      # time a slow call holds up only the test that made it. Not quiet: the log shows each test and
      # any slow launch.
      - name: On-screen tests
        if: ${{ !cancelled() && matrix.on_screen_tests != '' && steps.tests.outcome != 'skipped' }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          ON_SCREEN_TESTS: ${{ matrix.on_screen_tests }}
        run: |
          xctestrun=$(ls -t "$RUNNER_TEMP"/DerivedData/Build/Products/*.xctestrun | head -n 1)
          only=()
          for id in $ON_SCREEN_TESTS; do only+=("-only-testing:$id"); done
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "id=$UDID" \
            "${only[@]}" \
            -parallel-testing-enabled NO \
            -resultBundlePath OnScreenTests.xcresult

      # The run's log is long, and a run that executed nothing exits 0, so this prints the test
      # count and the failure messages. "Ran for" is a bundle's own run; its test step minus it is
      # install, launch and teardown. Tests queue for the main actor, so per-test times mislead.
      - name: Test summary
        if: always() && steps.changes.outputs.test == 'true'
        # `set +e`: the job's verdict is the test step's, not this step's. It
        # reads a JSON shape Apple reshuffles between Xcode releases, and a
        # green run must not turn red because jq could not find a key.
        run: |
          set +e -u
          bundles=()
          for b in Tests.xcresult OnScreenTests.xcresult; do
            if [ -d "$b" ]; then bundles+=("$b"); fi
          done
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "not produced (the step before it did not get that far)"
            exit 0
          fi
          bundle=${bundles[0]}
          if [ ${#bundles[@]} -gt 1 ]; then
            if xcrun xcresulttool merge "${bundles[@]}" --output-path Merged.xcresult > /dev/null; then
              bundle=Merged.xcresult
            else
              echo "could not merge ${bundles[*]}: the counts below are $bundle's alone"
            fi
          fi
          summary=$(xcrun xcresulttool get test-results summary --path "$bundle")
          tests=$(mktemp)
          xcrun xcresulttool get test-results tests --path "$bundle" > "$tests"
          echo "$summary" \
            | jq '{result, totalTestCount, passedTests, failedTests, skippedTests}' \
            || echo "could not read the summary — see the uploaded bundle"
          echo "-- failures"
          jq -r '[.. | objects | select(.result? == "Failed" and .nodeType? == "Test Case")]
                 | .[:40][] | "\(.name)\n    \([.. | objects | select(.nodeType? == "Failure Message") | .name] | join("\n    "))"' "$tests" \
            || echo "could not read the failures — see the uploaded bundle"
          echo "-- timing"
          for b in "${bundles[@]}"; do
            xcrun xcresulttool get test-results summary --path "$b" \
              | jq -r --arg b "$b" '"\($b): \(.totalTestCount) tests, ran for \((.finishTime - .startTime) | floor)s"' \
              || echo "could not read the count, start and finish of $b"
          done
          exit 0

      # The summary above is a best effort against a JSON shape Apple changes
      # between Xcode releases. Keep the bundles themselves so a failure can be
      # opened locally when it does not.
      # Also on a cancel, as when the job reaches its time limit.
      - name: Keep the result bundles
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: xcresults-${{ matrix.leg }}
          path: |
            Tests.xcresult
            OnScreenTests.xcresult
            hang
          retention-days: 7

  # A Mac-only compile error passes both legs above and `tools/check_macos_sources.py`, which
  # checks only which files the Mac build compiles. A job of its own, not a leg: it shares none
  # of their simulator and test steps. It runs nothing, so it builds unsigned.
  mac-build:
    name: macOS build
    runs-on: xcode-27
    timeout-minutes: 60
    # As in `unit-tests`: a push run deletes the cache it started from once it saved a newer one.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # app-translation's generator writes the localizations the build copies into each bundle.
          submodules: true
          fetch-depth: 2

      # Skips the steps, not the job, for the documentation-only changes `unit-tests` skips,
      # comparing a push the same way.
      - name: Changed paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          base=HEAD^1
          if [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ] && git fetch -q --depth=1 origin "$BEFORE"; then
            base=$BEFORE
          fi
          files=$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD)
          if [ -n "$files" ] && ! printf '%s\n' "$files" \
              | grep -qvE '\.md$|^(docs|openspec|api-poc|\.claude|\.agents|\.greptile|\.github/ISSUE_TEMPLATE)/|^LICENSE'; then
            run=false
            echo "Documentation-only change: skipping the build."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Xcode version
        if: steps.changes.outputs.run == 'true'
        run: |
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string hw.ncpu

      # The same cache action and rules as `unit-tests`, under its own `mac` key.
      - name: Restore the last build
        if: steps.changes.outputs.run == 'true'
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f  # v1.9.2
        with:
          key: xcode27-mac-${{ github.sha }}
          restore-keys: xcode27-mac-
          deriveddata-directory: ${{ runner.temp }}/DerivedData
          sourcepackages-directory: ${{ runner.temp }}/SourcePackages
          swiftpm-cache-key: xcode-packages-mac-${{ hashFiles('swift/TigerDuck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-mtime-targets: |
            swift/**/*.icon
            swift/**/*.icon/**/*
          cache-read-only: ${{ github.event_name != 'push' }}
          delete-used-deriveddata-cache: ${{ github.event_name == 'push' }}

      - name: Build
        if: steps.changes.outputs.run == 'true'
        run: |
          log="$RUNNER_TEMP/build.log"
          if ! xcodebuild build \
              -project swift/TigerDuck.xcodeproj \
              -scheme TigerDuck \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
              -showBuildTimingSummary \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGNING_ALLOWED=NO \
              > "$log" 2>&1; then
            grep -E "error:" "$log" | sort -u | head -50
            tail -n 30 "$log"
            exit 1
          fi
          sed -n '/Build Timing Summary/,$p' "$log" | grep -v '^$' | head -10

  # The vendored SwiftMail carries local patches (swift/Packages/SwiftMail/VENDORED.md), and its
  # SwiftPM tests are in no Xcode scheme, so only this job runs them. They need no simulator
  # and no timezone: they run against a loopback IMAP and SMTP server.
  vendored-package:
    name: vendored SwiftMail
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # No submodules: this package does not read app-translation.
        with:
          fetch-depth: 2

      # The package tests run only for a change to the package or to this file.
      - name: Changed paths
        id: changes
        run: |
          run=true
          files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          if ! printf '%s\n' "$files" | grep -qE '^swift/Packages/SwiftMail/|^\.github/workflows/tests\.yaml$'; then
            run=false
            echo "No change under swift/Packages/SwiftMail/ or to tests.yaml: skipping the package tests."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Xcode version
        if: steps.changes.outputs.run == 'true'
        run: xcodebuild -version

      - name: Package tests
        if: steps.changes.outputs.run == 'true'
        working-directory: swift/Packages/SwiftMail
        run: swift test

  # TigerDuckCore's rules have no screen and no I/O, so its SwiftPM tests need no simulator. They
  # are in no Xcode scheme, so only this job runs them.
  core-package:
    name: TigerDuckCore
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # No submodules: this package does not read app-translation.
        with:
          fetch-depth: 2

      # The package tests run only for a change to the package or to this file.
      - name: Changed paths
        id: changes
        run: |
          run=true
          files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          if ! printf '%s\n' "$files" | grep -qE '^swift/Packages/TigerDuckCore/|^\.github/workflows/tests\.yaml$'; then
            run=false
            echo "No change under swift/Packages/TigerDuckCore/ or to tests.yaml: skipping the package tests."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Xcode version
        if: steps.changes.outputs.run == 'true'
        run: xcodebuild -version

      - name: Package tests
        if: steps.changes.outputs.run == 'true'
        working-directory: swift/Packages/TigerDuckCore
        run: swift test

  # Below iOS 27 the app's tab roots take UIKit's search controller rather than `.searchable`
  # (swift/TigerDuck/UI/ViewHelpers/View+NavigationBarSearch.swift), and the phone leg runs
  # iOS 27. This job stays on macos-26 to download the iOS 18.6 runtime, the last of iOS 18, and
  # runs the search suites there on a cold build: there is no cache to restore. macos-15 still
  # ships iOS 18 runtimes, but its newest Xcode, 26.3, cannot build the app.
  ios18-search:
    name: iOS 18 search
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          fetch-depth: 2

      # The suites run only for a change to the search bridge, the pages that use it, its tests or
      # this file.
      - name: Changed paths
        id: changes
        run: |
          run=true
          files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          if ! printf '%s\n' "$files" | grep -qE '^(swift/TigerDuck/UI/ViewHelpers/View\+NavigationBarSearch|swift/TigerDuck/Features/InformationSystem/InformationSystemView|swift/TigerDuck/Features/Bulletins/BulletinsView|swift/TigerDuckTests/SearchDrawerFirstOpenTests|swift/TigerDuckTests/NavigationBarSearchTests)\.swift$|^\.github/workflows/tests\.yaml$'; then
            run=false
            echo "No change to the navigation bar search or to tests.yaml: skipping the build and tests."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # Xcode 27 downloads no runtime older than iOS 26 (https://developer.apple.com/forums/thread/847134).
      - name: iOS 18.6 simulator
        if: steps.changes.outputs.run == 'true'
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-18-6
          if ! xcrun simctl list runtimes --json | jq -e --arg r "$runtime" '.runtimes[] | select(.identifier == $r and .isAvailable)' > /dev/null; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.6
          fi
          udid=$(xcrun simctl create "iPhone 16 Pro" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$runtime")
          xcrun simctl list devices available | grep -E "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Signing stays on, as in `unit-tests`. The errors print in the order the compiler hit them.
      - name: Build for testing
        if: steps.changes.outputs.run == 'true'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          log="$RUNNER_TEMP/build.log"
          if ! xcodebuild build-for-testing \
              -project swift/TigerDuck.xcodeproj \
              -scheme TigerDuck \
              -destination "id=$UDID" \
              -only-testing:TigerDuckTests \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              > "$log" 2>&1; then
            grep -E "error:" "$log" | awk '!seen[$0]++' | head -50
            tail -n 30 "$log"
            exit 1
          fi

      # A run whose filter matches nothing exits 0, so the step also fails unless Swift Testing ran
      # as many tests as the suites' files declare: it counts a parameterized test once.
      - name: Search tests
        if: steps.changes.outputs.run == 'true'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          shopt -s nullglob
          runs=("$RUNNER_TEMP"/DerivedData/Build/Products/*.xctestrun)
          if [ ${#runs[@]} -ne 1 ]; then
            echo "::error::expected one .xctestrun, found ${#runs[@]}: ${runs[*]}"
            exit 1
          fi
          expected=0
          only=()
          for suite in SearchDrawerFirstOpenTests NavigationBarSearchTests; do
            expected=$((expected + $(grep -cE '^[[:space:]]*@Test' "swift/TigerDuckTests/$suite.swift")))
            only+=("-only-testing:TigerDuckTests/$suite")
          done
          log="$RUNNER_TEMP/tests.log"
          xcodebuild test-without-building \
            -xctestrun "${runs[0]}" \
            -destination "id=$UDID" \
            "${only[@]}" \
            -parallel-testing-enabled NO \
            2>&1 | tee "$log"
          ran=$(grep -oE 'Test run with [0-9]+ tests?' "$log" | grep -oE '[0-9]+' | tail -n 1 || true)
          if [ "${ran:-0}" -ne "$expected" ]; then
            echo "::error::ran ${ran:-no} tests; the suites declare $expected"
            exit 1
          fi
          echo "ran $ran tests, as the suites declare"
