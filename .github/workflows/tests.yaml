name: Tests

# Unit-test gate for PRs. Until this existed no workflow in the repo ever
# invoked xcodebuild, so the ~200 tests in `swift/TigerDuckTests/` only ran when
# someone remembered to press Cmd-U, and a break could sit there for weeks with
# nothing saying so. The watch tests were worse off still: they were in no
# shared scheme, so `xcodebuild -scheme TigerDuck` never even compiled them.
# The Android repo has had the equivalent gate (.github/workflows/ci.yaml) for
# a while; this is its counterpart.
#
# Deliberately unit tests only, matching that workflow's stance: no
# TigerDuckUITests (simulator UI automation is the usual source of CI flake,
# and its runner already fails to launch on some local simulators), and no
# second pass on the macOS destination.
#
# The phone and watch suites run on runners of their own, side by side. They
# used to run back to back in one job, so the gate took the sum of the two
# (8-14 min) where it now takes the slower one. That was written when the
# phone suite was ~200 tests that finished in seconds. At ~1,050 it takes a
# dev Mac ~35 s, but the phone leg's test phase on the 3-core runner is 5-7
# of its 13-16 minutes, and one `xcodebuild test` step cannot say how much
# of that is simulator boot and how much is the tests. So its phases run as
# separate steps below, each with its own time in the job view, and the
# summary step says how long the tests themselves ran.
#
# Note there is no `CODE_SIGNING_ALLOWED=NO` here, the usual CI shorthand for
# "this machine has no certificates". A simulator build signs ad-hoc and needs
# none, and turning signing off drops the app's entitlements with it — which
# takes the App Group container away, which makes the DEBUG guard in
# `WidgetSnapshotStore` and friends trap during launch, which crashes the test
# host before a single test runs.

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # macOS is the only image that can run xcodebuild, and the sources need an
    # Xcode 26 SDK — `glassEffect` and friends sit behind `if #available(iOS
    # 26)`, which still has to *compile*. If a future image defaults to
    # something older, select one explicitly with `sudo xcode-select -s`; the
    # version is printed below so a failure says which one it got.
    name: unit-tests (${{ matrix.leg }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      # Let both legs report: a phone failure must not cancel the watch run
      # and hide whatever it would have found.
      fail-fast: false
      matrix:
        include:
          - leg: phone
            scheme: TigerDuck
            runtime: iOS
            device: iPhone
            only_testing: TigerDuckTests
          # The watch app is a companion app, so it needs its own scheme and
          # its own destination; the phone scheme's test action does not reach
          # it. Xcode pairs the watch simulator with a phone one on its own.
          # That scheme builds the phone app for running only, not for
          # testing: built for a watch destination, the phone app and all
          # its packages came out for arm64 and x86_64 both, twice the phone
          # leg's compile, for tests that never load it.
          - leg: watch
            scheme: TigerDuckWatch Watch App
            runtime: watchOS
            device: Apple Watch
            only_testing: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # app-translation carries the .xcstrings the app target compiles.
          # Without it the build fails on missing resources rather than on
          # anything this workflow is meant to catch.
          submodules: true

      # The core count is what the test timings below have to be read
      # against: Swift Testing runs tests side by side, so a suite a dev Mac
      # finishes in seconds can take minutes on a runner a quarter its size.
      - name: Xcode version
        run: |
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string hw.ncpu

      # Every date in this app is a Taiwan school day: `AcademicCalendar.calendar`
      # and `WidgetTaipei.calendar` are hard-pinned to Asia/Taipei, while the
      # tests build their fixtures with `Calendar.current`. On the machines
      # these were written on those agree. On a UTC runner they are eight hours
      # apart, so a fixture meaning "Monday 09:30" arrives as Monday 17:30 —
      # `.ongoing` comes back `.tomorrowFirst`, and `(comps.hour → 2) == 10`
      # misses by exactly the offset. A simulator takes the host's zone, so
      # this is the one place to say it — and it goes before the simulator
      # starts booting, not after.
      - name: Run in the school's timezone
        run: |
          sudo systemsetup -settimezone Asia/Taipei
          date

      # Naming a simulator is how this breaks six months from now: images add
      # and drop devices, and `OS=latest` resolves to a runtime the named
      # device may not exist on. (That exact mismatch — iPhone 17 Pro Max
      # present on 26.5 while `latest` meant 27.0 — is what it does locally.)
      # Take whichever devices the image actually has.
      - name: Pick a simulator
        id: sim
        env:
          RUNTIME: ${{ matrix.runtime }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          # Newest runtime wins. A runner image ships one matched set of
          # runtimes per Xcode, so the newest watchOS pairs with the newest
          # iOS the watch leg's phone half will come from; a dev machine that
          # has accumulated several may not, and that is the case to notice if
          # the watch leg ever fails to pair.
          udid=$(xcrun simctl list devices available --json | jq -r --arg os "$RUNTIME" --arg name "$DEVICE" '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime\\." + $os + "-"))
              | (.key | capture("-(?<a>[0-9]+)-(?<b>[0-9]+)$")) as $v
              | .value[]
              | select(.name | startswith($name))
              | {ver: [($v.a | tonumber), ($v.b | tonumber)], udid}
            ] | sort_by(.ver) | last.udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::no $RUNTIME simulator named $DEVICE*"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep -E "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Brings back this leg's last build so only what changed recompiles.
      # A cached DerivedData alone is not enough: a fresh checkout stamps
      # every file with the checkout's time, Xcode reads a new mtime as a
      # changed file, and everything rebuilds anyway. This action also keeps
      # each source file's mtime next to its hash, and puts the old mtime back
      # on every file whose contents still match. The package clones are a
      # second cache keyed on Package.resolved, which both legs share.
      #
      # Both live in the runner's temp directory rather than in the checkout,
      # so the action's mtime scan over the checkout does not walk into them;
      # every xcodebuild below is pointed there.
      #
      # The package clones are per leg, not shared, though both legs clone
      # the same packages. A leg's DerivedData remembers the mtimes of the
      # clone it compiled, and the action restores mtimes only inside the
      # checkout. Shared, the clones came from whichever leg saved first, and
      # the other leg saw every package file as changed: the first warm run
      # rebuilt the watch leg's 1,846 Swift and 892 C files from scratch while
      # the phone leg, whose clone it was, compiled 2.
      #
      # The action's own list of files to restore mtimes on covers asset
      # catalogs but not Icon Composer `.icon` bundles, and the app icon is
      # one. Left out, it came back from every checkout looking new, and
      # actool re-rendered it — 57-154 s of a warm phone build that
      # otherwise compiled 2 files.
      - name: Restore the last build
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f  # v1.9.2
        with:
          key: xcode-${{ matrix.leg }}-${{ github.sha }}
          restore-keys: xcode-${{ matrix.leg }}-
          deriveddata-directory: ${{ runner.temp }}/DerivedData
          sourcepackages-directory: ${{ runner.temp }}/SourcePackages
          swiftpm-cache-key: xcode-packages-${{ matrix.leg }}-${{ hashFiles('swift/TigerDuck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-mtime-targets: |
            swift/**/*.icon
            swift/**/*.icon/**/*

      # The next steps are what a single `xcodebuild test` does inside
      # itself: fetch packages, compile, wait for the simulator, run. Split,
      # the job view times each one; whole, it showed one 13-16 minute step
      # and no way to tell which part was slow. Not `-quiet`: with the clones
      # restored this should fetch nothing, and the log is how to tell.
      - name: Resolve packages
        env:
          SCHEME: ${{ matrix.scheme }}
        run: >
          xcodebuild -resolvePackageDependencies
          -project swift/TigerDuck.xcodeproj
          -scheme "$SCHEME"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      # The boot starts here and runs alongside the compile: `simctl boot`
      # returns once the boot is under way, and the "Wait for the simulator"
      # step after the build collects it. Not any earlier: a first boot takes
      # the runner's 3 cores for a minute or two, and started at the top of
      # the job it slowed the cache download from ~70 MB/s to ~4.
      - name: Start the simulator booting
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: xcrun simctl boot "$UDID"

      # No index store: it is what Xcode's jump-to-definition and search read,
      # nothing here does, and writing it costs compile time and cache space.
      #
      # The full log goes to a file, each line stamped with the time it
      # arrived, and what the job prints is: the count of each kind of task
      # the build ran and of compiles per target (an up-to-date rebuild runs
      # no SwiftCompile or CompileC at all), the longest silences in the log
      # with the line that ended each, and xcodebuild's own timing summary.
      - name: Build for testing
        env:
          SCHEME: ${{ matrix.scheme }}
          UDID: ${{ steps.sim.outputs.udid }}
          ONLY_TESTING: ${{ matrix.only_testing }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/build.log"
          if ! xcodebuild build-for-testing \
              -project swift/TigerDuck.xcodeproj \
              -scheme "$SCHEME" \
              -destination "id=$UDID" \
              ${ONLY_TESTING:+"-only-testing:$ONLY_TESTING"} \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
              -showBuildTimingSummary \
              COMPILER_INDEX_STORE_ENABLE=NO \
              2>&1 | perl -MTime::HiRes=time -ne 'printf "%.1f %s", time, $_' > "$log"; then
            cut -d' ' -f2- "$log" | grep -E "error:" | sort -u | head -50
            tail -n 30 "$log" | cut -d' ' -f2-
            exit 1
          fi
          set +o pipefail
          echo "-- tasks run"
          cut -d' ' -f2- "$log" | grep -oE '^[A-Z][A-Za-z]+ ' | sort | uniq -c | sort -rn | head -20
          echo "-- compiles by target"
          cut -d' ' -f2- "$log" | grep -E '^(SwiftCompile|CompileC) ' \
            | grep -oE "in target '[^']+' from project '[^']+'" | sort | uniq -c | sort -rn | head -40
          echo "-- longest silences (seconds: the line before | the line after)"
          awk '{ line = substr($0, index($0, " ") + 1) }
               NR > 1 { printf "%7.1f  %.110s | %.110s\n", $1 - prev, last, line }
               { prev = $1; last = line }' "$log" \
            | sort -rn 2>/dev/null | head -15
          echo "-- xcodebuild timing summary"
          cut -d' ' -f2- "$log" | sed -n '/Build Timing Summary/,$p' | head -40
          true

      # bootstatus prints a status line about once a second until the device
      # is up; only the last few say anything.
      - name: Wait for the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$UDID" -b | tail -n 3

      - name: Unit tests (${{ matrix.leg }})
        env:
          SCHEME: ${{ matrix.scheme }}
          UDID: ${{ steps.sim.outputs.udid }}
          ONLY_TESTING: ${{ matrix.only_testing }}
        run: >
          xcodebuild test-without-building
          -project swift/TigerDuck.xcodeproj
          -scheme "$SCHEME"
          -destination "id=$UDID"
          ${ONLY_TESTING:+"-only-testing:$ONLY_TESTING"}
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -resultBundlePath Tests.xcresult
          -quiet

      # `-quiet` keeps the log readable but also hides the test count, and a
      # run that silently executed nothing exits 0 exactly like a real pass.
      # Read the counts back out so the log says what actually ran. `always()`
      # so a failing run still reports which tests failed.
      #
      # The per-failure detail matters more than it looks: `-quiet` also hides
      # *why* a test failed, and a mid-run crash marks every remaining test
      # failed with no message attached — so a bare list of names cannot tell
      # "173 real failures" apart from "one crash, 172 casualties".
      #
      # "Ran for" is the bundle's own start to finish; the test step's time
      # minus it is app install, launch and teardown. There is deliberately no
      # per-suite or per-test breakdown: Swift Testing starts nearly every test
      # at once and they queue for the main actor, so a test's recorded
      # duration is mostly its wait. On the runner 964 of 1,060 "took" over a
      # second inside a run that lasted 111 s.
      - name: Test summary
        if: always()
        # `set +e`: the job's verdict is the test step's, not this step's. It
        # reads a JSON shape Apple reshuffles between Xcode releases, and a
        # green run must not turn red because jq could not find a key.
        run: |
          set +e -u
          bundle=Tests.xcresult
          if [ ! -d "$bundle" ]; then
            echo "not produced (the step before it did not get that far)"
            exit 0
          fi
          summary=$(xcrun xcresulttool get test-results summary --path "$bundle")
          tests=$(mktemp)
          xcrun xcresulttool get test-results tests --path "$bundle" > "$tests"
          echo "$summary" \
            | jq '{result, totalTestCount, passedTests, failedTests, skippedTests}' \
            || echo "could not read the summary — see the uploaded bundle"
          echo "-- failures"
          jq -r '[.. | objects | select(.result? == "Failed" and .nodeType? == "Test Case")]
                 | .[:40][] | "\(.name)\n    \([.. | objects | select(.nodeType? == "Failure Message") | .name] | join("\n    "))"' "$tests" \
            || echo "could not read the failures — see the uploaded bundle"
          echo "-- timing"
          echo "$summary" | jq -r '"ran for \((.finishTime - .startTime) | floor)s"' \
            || echo "could not read the run's start and finish"
          exit 0

      # The summary above is a best effort against a JSON shape Apple changes
      # between Xcode releases. Keep the bundle itself so a failure can be
      # opened locally when it does not.
      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xcresults-${{ matrix.leg }}
          path: Tests.xcresult
          retention-days: 7

  # The vendored SwiftMail carries nine local patches on top of upstream 1.11.0
  # (see swift/Packages/SwiftMail/VENDORED.md). Its own SwiftPM test targets are
  # in no Xcode scheme, so `xcodebuild -scheme TigerDuck` never compiled them and
  # the tests pinning those patches ran only when someone typed `swift test` by
  # hand. Patches 2, 5 and 6 happen to have cover in TigerDuckTests; patches 3
  # (send CHARSET only for non-ASCII SEARCH criteria) and 4 had none at all, so a
  # re-vendor could have dropped either with nothing going red.
  #
  # No simulator and no timezone step: these are pure SwiftPM tests against a
  # loopback IMAP/SMTP server, so they need neither a device nor Asia/Taipei.
  vendored-package:
    name: vendored SwiftMail
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # No submodules: this package does not read app-translation.

      - name: Xcode version
        run: xcodebuild -version

      - name: Package tests
        working-directory: swift/Packages/SwiftMail
        run: swift test
