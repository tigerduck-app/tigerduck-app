name: Localization keys

on:
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          # No `ref:` override on purpose. The default for a pull_request
          # event is the merge ref, which is what we actually want to check:
          # whether the *merged* result would ship a raw key. Pinning to
          # head.sha also breaks whenever the checker itself only exists on
          # the base branch.

      - name: Check every referenced localization key is translated
        run: python3 tools/localization/check_keys.py
