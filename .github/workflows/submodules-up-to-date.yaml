name: Submodules up to date

on:
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      # A pull request to main needs every pin at the upstream tip; one to dev needs each pin on
      # the upstream branch and not behind the pin on dev (tools/check_submodule_pins.py).
      - name: Check each submodule pin
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_submodule_pins.py --base-ref "${BASE_REF}"
