name: Comments

# The comment rules from AGENTS.md, checked on the blocks a pull request adds or changes.

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: comments-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The merge commit and its base, for `--base HEAD^1`.
          fetch-depth: 2

      - name: Checker tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Check comments
        run: python3 tools/check_comments.py check --base HEAD^1
