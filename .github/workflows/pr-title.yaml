name: Pull request title

# The title becomes the squash commit's subject, so it follows Conventional Commits.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|docs|test|chore|perf|ci|build|style|revert)(\([^()]+\))?!?: .+'
          if [[ ! "${TITLE}" =~ ${pattern} && "${TITLE}" != Revert\ \"* ]]; then
            echo "::error::Title '${TITLE}' is not Conventional Commits: type(Scope): description, with a type of feat, fix, refactor, docs, test, chore, perf, ci, build, style or revert."
            exit 1
          fi
